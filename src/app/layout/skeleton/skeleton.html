<main id="main-container" class="bg-base-100 w-screen h-screen flex flex-col justify-center items-center ">
    <div
        class=" w-4/5 h-4/5  md:w-[90%] md:h-[90%]  grid grid-cols-1 grid-rows-2 md:grid-rows-1 md:grid-cols-5 items-stretch rounded-smr overflow-hidden shadow-xl/30">
        <div class="h-full md:col-span-3 md:min-h-full relative">
            @if (decorationCenter == undefined && dataTheme !='default') {
                <img *ngIf="decorationRight" width="200" height="80" [src]="decorationRight"
                    class="w-40 fixed top-5 right-22 z-10" 
                    [ngClass]="{'top-11':dataTheme=='halloween'}"
                    />
                <img *ngIf="decorationLeft" width="200" height="80" [src]="decorationLeft"
                    class="w-40 fixed top-5 left-7/12 z-10 rotate-y-180" 
                    [ngClass]="{'top-11':dataTheme=='halloween'}"
                    />
            }@else {
                <img *ngIf="decorationCenter" width="200" height="80" [src]="decorationLeft"
                    class="w-[20%] fixed top-15  left-8/12 z-10 "
                />
            }
            <app-publicity></app-publicity>
        </div>

        <div class=" md:col-span-2 min-h-full">
            <app-auth></app-auth>
        </div>
    </div>
</main>
